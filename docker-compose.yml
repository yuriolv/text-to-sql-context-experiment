services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tccsql
      POSTGRES_USER: tcc_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcc_owner -d tccsql"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:
