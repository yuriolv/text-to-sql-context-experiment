[project]
name = "tcc-text2sql"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "PyYAML>=6", "psycopg[binary]>=3.2", "sqlglot>=25", "pandas>=2.2", "scipy>=1.13", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
