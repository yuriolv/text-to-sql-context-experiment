domain: "Base comercial descaracterizada, autorizada pelo responsável do estudo para uso acadêmico local."
privacy: "Não incluir valores de linhas, nomes, razão social nem identificadores descaracterizados em chamadas a provedores externos."
money_fields:
  orders.total_amount: "Valor final do pedido no grão de cabeçalho, já após descontos."
  orders.gross_amount: "Valor bruto do pedido, antes de aplicar descontos."
  orders.discount_amount: "Desconto concedido no cabeçalho do pedido."
  orders.delivered_amount: "Valor efetivamente entregue do pedido."
  order_items.total_amount: "Valor do item (quantity × unit_price) no grão de item; nunca igual a orders.total_amount."
  order_items.unit_price: "Preço unitário praticado no item."
  targets.achieved_amount: "Valor realizado pelo representante no período da meta; não é meta planejada."
  products.list_price: "Preço de lista cadastrado no produto, não o praticado em pedido."
  products.purchase_value: "Custo de compra registrado."
  products.cost_value: "Custo contábil registrado."
count_fields:
  orders.item_count: "Quantidade de itens informada no cabeçalho do pedido; distinta de COUNT(*) sobre order_items."
  order_items.quantity: "Quantidade do item no pedido."
grain_rules:
  - "orders é cabeçalho (1 linha por pedido); order_items é detalhe (N linhas por pedido). Nunca some orders.total_amount depois de juntar order_items."
  - "Para 'faturamento no grão de pedido', use SUM(orders.total_amount). Para 'faturamento no grão de item', use SUM(order_items.total_amount)."
  - "targets usa grão (representative_id, target_date)."
temporal_rules:
  - "Vendas emitidas: orders.issued_at. Entrega prevista: orders.expected_delivery_date."
  - "Período da meta/realizado: targets.target_date."
  - "Vigência de coleção: collections.start_date e collections.end_date."
  - "Cadastro de cliente: customers.registered_at."
referential_rules:
  - "Chaves FK podem apontar para linhas inexistentes (a base contém referências órfãs e o schema não enforça)."
  - "Para 'quantos X têm Y informado', use WHERE Y IS NOT NULL (conta o campo preenchido)."
  - "Para 'quantos X estão associados a Y existente', use JOIN com a tabela Y (exclui referências órfãs)."
  - "A escolha entre IS NOT NULL e JOIN muda o resultado quando há FKs órfãs."
synonyms:
  vendedor: representatives
  representante: representatives
  pedido: orders
  item: order_items
  produto: products
  faturamento: orders.total_amount ou order_items.total_amount, conforme grão pedido na pergunta
response_style:
  - "Devolva apenas as colunas pedidas: a chave de agrupamento e as agregações. Não acrescente colunas descritivas (como nome) se a pergunta não pediu."
  - "Para perguntas do tipo 'quantos'/'qual a soma'/'qual a média' sem agrupamento explícito, devolva um único valor escalar, sem GROUP BY."
  - "Mantenha os tipos nativos retornados pelas funções do PostgreSQL; não aplique cast desnecessário."
